name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run diagnostics
        run: go vet ./...
      - name: Install Python diagnostics
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/acr-python-diagnostics"
          "${RUNNER_TEMP}/acr-python-diagnostics/bin/python" -m pip install -r requirements-dev.txt
          echo "${RUNNER_TEMP}/acr-python-diagnostics/bin" >> "$GITHUB_PATH"
      - name: Run Python diagnostics
        run: pyright --project pyrightconfig.json --warnings
      - name: Verify Pyright detects a type defect
        run: |
          set -euo pipefail
          probe_dir=$(mktemp -d "$RUNNER_TEMP/pyright-probe.XXXXXX")
          helper=internal/adapter/acr-hook.py
          probe="$probe_dir/${helper##*/}"
          original=$(git hash-object --no-filters "$helper")
          cp "$helper" "$probe"
          pyright --project pyrightconfig.json --warnings "$probe"

          printf '\n_ci_pyright_probe: int = "deliberate type defect"\n' >> "$probe"
          line_count=$(wc -l < "$probe")
          if report=$(pyright --project pyrightconfig.json --warnings --outputjson "$probe"); then
            echo "Pyright accepted the deliberate type defect. Inspect the probe and Pyright configuration." >&2
            exit 1
          else
            status=$?
          fi
          printf '%s\n' "$report"
          if [[ "$status" != 1 ]]; then
            echo "Pyright probe exited $status. Inspect the engine and project configuration errors above." >&2
            exit "$status"
          fi
          if ! jq -e --arg file "$probe" --argjson line "$((line_count - 1))" '
            .generalDiagnostics | length == 1 and
            (.[0] | .file == $file and .range.start.line == $line and
              .severity == "error" and .rule == "reportAssignmentType")
          ' <<< "$report" > /dev/null; then
            echo "Pyright did not report the expected assignment error on the injected line. Inspect the probe diagnostics above." >&2
            exit 1
          fi
          if [[ "$(git hash-object --no-filters "$helper")" != "$original" ]]; then
            echo "The Pyright probe changed $helper. Inspect the probe copy and checkout." >&2
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Git prerequisite
        run: git --version
      - name: Install the pinned SBOM generator
        # Pinned release; review monthly beside the GitHub Actions pins.
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: Run tests
        run: go test -race -coverprofile=coverage.out -timeout=30m ./...
      - name: Build acr
        run: go build ./cmd/acr

  build:
    name: Build and run (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build acr
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: go build -trimpath -o "${{ runner.temp }}/acr-${GOOS}-${GOARCH}" ./cmd/acr
      - name: Run acr
        run: '"${{ runner.temp }}/acr-${{ matrix.goos }}-${{ matrix.goarch }}" version'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: verify
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, test, build, secrets]
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | [.key, .value.result] | @tsv' |
            while IFS=$'\t' read -r job result; do
              if [[ "$result" != success ]]; then
                echo "Job $job finished with $result; inspect its logs and rerun the failed checks." >&2
                exit 1
              fi
            done
