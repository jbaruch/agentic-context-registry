name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run diagnostics
        run: go vet ./...
      - name: Install Python diagnostics
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/acr-python-diagnostics"
          "${RUNNER_TEMP}/acr-python-diagnostics/bin/python" -m pip install -r requirements-dev.txt
          echo "${RUNNER_TEMP}/acr-python-diagnostics/bin" >> "$GITHUB_PATH"
      - name: Run Python diagnostics
        run: pyright --project pyrightconfig.json --warnings

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Git prerequisite
        run: git --version
      - name: Install the Linux Codex read boundary
        # The Codex boundary tests run the real bubblewrap namespace on Linux
        # and never skip. Install the package and explicitly verify Noble
        # profile setup plus its restricted child transition.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # Review monthly and on Ubuntu bubblewrap security updates: verify Noble amd64
          # metadata and archive availability, make a focused bump, and repeat native boundary proof.
          sudo apt-get install -y --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3
          installed="$(dpkg-query -W -f='${Version} ${Architecture} ${db:Status-Status}\n' bubblewrap)"
          if [[ "$installed" != '0.9.0-1ubuntu0.3 amd64 installed' ]]; then
            printf 'Expected installed bubblewrap 0.9.0-1ubuntu0.3 amd64; got %s. Verify Noble metadata and renew the pin before retrying.\n' "$installed" >&2
            exit 1
          fi
          printf 'Verified bubblewrap: %s\n' "$installed"
          bash .github/scripts/setup-bwrap-profile.sh
      - name: Upload Linux boundary evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bwrap-test
          path: ${{ runner.temp }}/bwrap-evidence
          if-no-files-found: error
      - name: Install the pinned SBOM generator
        # Pinned release; review monthly beside the GitHub Actions pins.
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: Run tests
        run: go test -race -coverprofile=coverage.out -timeout=30m ./...
      - name: Build acr
        run: go build ./cmd/acr

  build:
    name: Build and run (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build acr
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: go build -trimpath -o "${{ runner.temp }}/acr-${GOOS}-${GOARCH}" ./cmd/acr
      - name: Run acr
        run: '"${{ runner.temp }}/acr-${{ matrix.goos }}-${{ matrix.goarch }}" version'

  codex-runtime:
    name: Codex runtime contract (${{ matrix.os }}, ${{ matrix.codex }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        # Every release in internal/producerconvert CodexVerifiedReleases; the
        # digests live in .github/scripts/install-codex.sh. Extend both together.
        codex: ["0.153.2", "0.154.0", "0.155.0", "0.166.0", "0.167.2"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the Linux Codex read boundary
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # Review monthly and on Ubuntu bubblewrap security updates: verify Noble amd64
          # metadata and archive availability, make a focused bump, and repeat native boundary proof.
          sudo apt-get install -y --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3
          installed="$(dpkg-query -W -f='${Version} ${Architecture} ${db:Status-Status}\n' bubblewrap)"
          if [[ "$installed" != '0.9.0-1ubuntu0.3 amd64 installed' ]]; then
            printf 'Expected installed bubblewrap 0.9.0-1ubuntu0.3 amd64; got %s. Verify Noble metadata and renew the pin before retrying.\n' "$installed" >&2
            exit 1
          fi
          printf 'Verified bubblewrap: %s\n' "$installed"
          bash .github/scripts/setup-bwrap-profile.sh
      - name: Upload Linux boundary evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bwrap-runtime-${{ matrix.codex }}
          path: ${{ runner.temp }}/bwrap-evidence
          if-no-files-found: error
      - name: Install the pinned Codex release
        run: bash .github/scripts/install-codex.sh "${{ matrix.codex }}"
      - name: Run offline capabilities and recorded event contracts
        # No proposal turn or model-service reachability check runs here.
        env:
          ACR_CODEX_RELEASE_REQUIRED: "1"
          ACR_CODEX_RELEASE_EVIDENCE: ${{ runner.temp }}/codex-evidence
        run: go test -race -count=1 -run '^(TestCodexRuntimeRealRelease|TestCodexStartupContractPerVerifiedRelease|TestCodexReadBoundaryDeniesInheritedInstructionsNatively)$' -v ./internal/producerconvert
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-runtime-${{ matrix.os }}-${{ matrix.codex }}
          path: ${{ runner.temp }}/codex-evidence
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: verify
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, test, build, secrets, codex-runtime]
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | [.key, .value.result] | @tsv' |
            while IFS=$'\t' read -r job result; do
              if [[ "$result" != success ]]; then
                echo "Job $job finished with $result; inspect its logs and rerun the failed checks." >&2
                exit 1
              fi
            done
