name: Release acr CLI

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard immutable release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - name: Check Homebrew tap credentials
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_DEPLOY_KEY}" ]]; then
            echo "Homebrew tap authentication is not configured; add the repository Actions secret described in .env.example before pushing a tag." >&2
            exit 1
          fi
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify tagged source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build ./cmd/acr
          go mod verify
      - name: Refuse an existing or moved version
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./internal/releasetool guard \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" > "${RUNNER_TEMP}/guard.json"
          version="$(jq -r '.version' "${RUNNER_TEMP}/guard.json")"
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "Release guard returned no version; inspect the guard result and retry." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build deterministic release assets
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-compile all targets twice
        env:
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/acr-bin" "${RUNNER_TEMP}/acr-repro"
          for target in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            goos="${target%-*}"
            goarch="${target#*-}"
            ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" -o "${RUNNER_TEMP}/acr-bin/acr-${target}" ./cmd/acr
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" -o "${RUNNER_TEMP}/acr-repro/acr-${target}" ./cmd/acr
            cmp "${RUNNER_TEMP}/acr-bin/acr-${target}" "${RUNNER_TEMP}/acr-repro/acr-${target}"
          done
      - name: Pack archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          go run ./internal/releasetool pack \
            --input "${RUNNER_TEMP}/acr-bin" \
            --output "${RUNNER_TEMP}/release-assets" \
            --license LICENSE
      - name: Generate deterministic CycloneDX SBOM
        env:
          CGO_ENABLED: 0
          GOARCH: amd64
          GOOS: linux
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Pinned release; review monthly beside the GitHub Actions pins.
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          raw="${RUNNER_TEMP}/acr.cdx.raw.json"
          output="${RUNNER_TEMP}/release-assets/acr.cdx.json"
          cyclonedx-gomod app -json -licenses -noserial -notimestamp \
            -main cmd/acr -output "${raw}" .
          if ! jq -e '.metadata.component.name | test("agentic-context-registry")' "${raw}" > /dev/null; then
            echo "Generated SBOM does not identify the agentic-context-registry module; inspect cyclonedx-gomod output before retrying." >&2
            exit 1
          fi
          jq --arg version "${VERSION}" \
            '.metadata.component.name = "acr" | .metadata.component.version = $version' \
            "${raw}" > "${output}"
          go run ./internal/releasetool verify-sbom --version "${VERSION}" --path "${output}"
      - name: Upload release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acr-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [guard, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Download release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acr-release-${{ github.sha }}
          path: release-assets
      - name: Verify, extract, and execute the target asset
        env:
          COMMIT: ${{ github.sha }}
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          if [[ "${GOOS}" == "darwin" ]]; then
            shasum -a 256 -c checksums.txt
          else
            sha256sum -c checksums.txt
          fi
          mkdir extracted
          tar -xzf "acr-${GOOS}-${GOARCH}.tar.gz" -C extracted
          "${PWD}/extracted/acr" version --json > version.json
          reported_version="$(jq -r '.result.version' version.json)"
          reported_commit="$(jq -r '.result.commit' version.json)"
          if [[ "v${reported_version}" != "${TAG}" || "${reported_commit}" != "${COMMIT}" ]]; then
            echo "Published candidate reports ${reported_version} (${reported_commit}); expected ${TAG} (${COMMIT})." >&2
            exit 1
          fi

  release:
    name: Sign, attest, and publish
    needs: [guard, build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download verified release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acr-release-${{ github.sha }}
          path: release-assets
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned release; review monthly beside the GitHub Actions pins.
          cosign-release: v3.0.6
      - name: Sign and verify the checksum manifest
        env:
          IDENTITY: https://github.com/jbaruch/agentic-context-registry/.github/workflows/release-cli.yml@refs/tags/${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle release-assets/checksums.txt.sigstore.json \
            release-assets/checksums.txt
          cosign verify-blob \
            --bundle release-assets/checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${IDENTITY}" \
            release-assets/checksums.txt
      - name: Attest every archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/checksums.txt
      - name: Verify archive attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in release-assets/acr-*.tar.gz; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}"
          done
      - name: Publish the immutable draft
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./internal/releasetool publish \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --assets release-assets > "${RUNNER_TEMP}/release.json"
          url="$(jq -r '.releaseUrl' "${RUNNER_TEMP}/release.json")"
          if [[ -z "${url}" || "${url}" == "null" ]]; then
            echo "Release publisher returned no URL; inspect the draft state before retrying." >&2
            exit 1
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

  formula:
    name: Render Homebrew formula
    needs: [guard, build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download release checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acr-release-${{ github.sha }}
          path: release-assets
      - name: Render formula from published digests
        shell: bash
        run: |
          set -euo pipefail
          go run ./internal/releasetool formula \
            --version "${{ needs.guard.outputs.version }}" \
            --checksums release-assets/checksums.txt \
            --output formula/acr.rb
      - name: Upload formula candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acr-formula-${{ github.sha }}
          path: formula/acr.rb
          if-no-files-found: error
          retention-days: 1

  brew:
    name: Test Homebrew (${{ matrix.os }})
    needs: [guard, formula, release]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Download formula candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acr-formula-${{ github.sha }}
          path: formula
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - name: Install and test the published release
        env:
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          brew install --formula "${GITHUB_WORKSPACE}/formula/acr.rb"
          brew test acr
          acr version --json > "${RUNNER_TEMP}/brew-version.json"
          if [[ "$(jq -r '.result.version' "${RUNNER_TEMP}/brew-version.json")" != "${VERSION}" || \
                "$(jq -r '.result.commit' "${RUNNER_TEMP}/brew-version.json")" != "${COMMIT}" ]]; then
            echo "Homebrew installed an acr build that does not match this tag and commit." >&2
            exit 1
          fi

  tap:
    name: Update Homebrew tap
    needs: [guard, formula, brew]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download tested formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acr-formula-${{ github.sha }}
          path: formula
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jbaruch/homebrew-acr
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Publish the tested formula
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp formula/acr.rb tap/Formula/acr.rb
          git -C tap add Formula/acr.rb
          if git -C tap diff --cached --quiet; then
            echo "Homebrew formula did not change for release ${VERSION}; inspect the tap before retrying." >&2
            exit 1
          fi
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap commit -m "Update acr to ${VERSION}"
          git -C tap push origin HEAD:main
