name: Codex live conversion

# Explicitly triggered lane: converts the untouched upstream fixtures with a
# real Codex release and the CODEX_API_KEY repository secret, then publishes,
# installs, realizes and checks the converted commit through the local GitHub
# fixture. It never runs on pull requests, so a fork can never reach the
# secret, and it refuses a missing secret instead of skipping.
#
# Requires one repository secret (set it at
# https://github.com/jbaruch/agentic-context-registry/settings/secrets/actions):
#   CODEX_API_KEY — an OpenAI API key for the Codex CLI; see .env.example.

on:
  workflow_dispatch:
    inputs:
      codex-version:
        description: Codex release to install (must be in .github/scripts/install-codex.sh)
        required: false
        type: string
        default: "0.155.0"

permissions:
  contents: read

concurrency:
  group: codex-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    name: Live conversion (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: Check Codex credentials
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CODEX_API_KEY}" ]]; then
            echo "Codex authentication is not configured; add the CODEX_API_KEY repository Actions secret described in .env.example at https://github.com/jbaruch/agentic-context-registry/settings/secrets/actions before dispatching this workflow." >&2
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the Linux Codex read boundary
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Install the pinned Codex release
        run: bash .github/scripts/install-codex.sh "${{ inputs.codex-version }}"
      - name: Clone the untouched upstream fixtures
        # Pinned upstream commits; refresh them beside the fixture provenance
        # in docs/testing.md when a newer untouched baseline is verified.
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/tesslio/good-oss-citizen "${RUNNER_TEMP}/goc"
          git -C "${RUNNER_TEMP}/goc" checkout -q f21fda887815af815979a4fea43a66eb5174ee3e
          git clone -q https://github.com/jbaruch/frequent-flyer-advocate "${RUNNER_TEMP}/ffa"
          git -C "${RUNNER_TEMP}/ffa" checkout -q 142babbb1e2bebc798eb42128ac2466f21b5131d
          git -C "${RUNNER_TEMP}/goc" config user.email codex-live@example.invalid
          git -C "${RUNNER_TEMP}/goc" config user.name "ACR Codex live lane"
          git -C "${RUNNER_TEMP}/ffa" config user.email codex-live@example.invalid
          git -C "${RUNNER_TEMP}/ffa" config user.name "ACR Codex live lane"
      - name: Convert with the real release
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          ACR_CODEX_LIVE: "1"
          ACR_CODEX_LIVE_REQUIRED: "1"
          ACR_CODEX_LIVE_EVIDENCE: ${{ runner.temp }}/codex-live-evidence
          ACR_CODEX_LIVE_GOC: ${{ runner.temp }}/goc
          ACR_CODEX_LIVE_GOC_SHA: f21fda887815af815979a4fea43a66eb5174ee3e
          # FFA is explicitly excluded until ACR can convert a publisher that is
          # a job-level `uses:` call of a reusable workflow: at 142babbb the
          # publisher calls jbaruch/coding-policy publish-plugin.yml, and the
          # delivery-preservation validator refuses every proposal that changes
          # that job ("independent uses condition/policy must remain"), before
          # any write. The runtime completes every turn; the gap is a delivery
          # conversion feature, tracked separately from #156. Set the checkout
          # path here once that conversion exists.
          ACR_CODEX_LIVE_FFA: skip
          ACR_CODEX_LIVE_FFA_SHA: 142babbb1e2bebc798eb42128ac2466f21b5131d
        run: go test -race -count=1 -timeout 140m -run 'TestCodexLiveSemanticConversion|TestCodexLiveUpstreamConversion|TestCodexLiveEvidenceIsMachineReadable' -v ./cmd/acr
      - name: Publish, install, realize and check each converted commit
        env:
          ACR_SEMANTIC_ACCEPTANCE_REQUIRED: "1"
          ACR_CODEX_LIVE_EVIDENCE: ${{ runner.temp }}/codex-live-evidence
        shell: bash
        run: |
          set -euo pipefail
          consumed=0
          while IFS= read -r record; do
            root="$(cat "${record}")"
            commit="$(cat "$(dirname "${record}")/converted-commit.txt")"
            echo "consuming ${root} at ${commit}"
            ACR_SEMANTIC_ACCEPTANCE_ROOT="${root}" ACR_SEMANTIC_ACCEPTANCE_COMMIT="${commit}" go test -race -count=1 -run 'TestSemanticLiveGeneratedPublication' -v ./cmd/acr
            consumed=$((consumed + 1))
          done < <(find "${ACR_CODEX_LIVE_EVIDENCE}" -name converted-root.txt | sort)
          if [[ "${consumed}" -eq 0 ]]; then
            echo "no converted commit was recorded; the conversion step must fail before this step is reached" >&2
            exit 1
          fi
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-live-${{ matrix.os }}
          path: ${{ runner.temp }}/codex-live-evidence
          if-no-files-found: error
