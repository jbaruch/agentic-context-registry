# Project Codex hook host. Run go run ./cmd/acr realize after cloning.
# ACR manages hook registrations; keep contributor-local Tessl MCP settings uncommitted.
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
timeout = 600
command = "acr_root=$PWD\nwhile [ ! -f \"$acr_root/agents.yaml\" ]; do\n  if [ \"$acr_root\" = / ]; then\nprintf '%s\\n' 'ACR hook .codex/hooks/acr__jbaruch__agentic-context-registry__freshness-session-start/session-start.sh (session-start): runtime failure: no agents.yaml above session cwd; Launch inside the ACR project.' >&2\nprintf '%s\\n' '{\"systemMessage\":\"ACR hook .codex/hooks/acr__jbaruch__agentic-context-registry__freshness-session-start/session-start.sh (session-start): runtime failure: no agents.yaml above session cwd; Launch inside the ACR project.\"}'\nexit 0\n  fi\n  acr_root=${acr_root%/*}\n  if [ -z \"$acr_root\" ]; then acr_root=/; fi\ndone\nacr_hook_timeout=600\ncommand -v python3 >/dev/null || {\nprintf '%s\\n' 'ACR hook .codex/hooks/acr__jbaruch__agentic-context-registry__freshness-session-start/session-start.sh (session-start): could not run because Python >= 3.9 is unavailable; Install Python >= 3.9 on the agent PATH and retry.' >&2\nprintf '%s\\n' '{\"systemMessage\":\"ACR hook .codex/hooks/acr__jbaruch__agentic-context-registry__freshness-session-start/session-start.sh (session-start): could not run because Python \\u003e= 3.9 is unavailable; Install Python \\u003e= 3.9 on the agent PATH and retry.\"}'\nexit 0\n}\n[ -f \"$acr_root/.codex/hooks/acr-hook.py\" ] && [ -r \"$acr_root/.codex/hooks/acr-hook.py\" ] || {\nprintf '%s\\n' 'ACR hook .codex/hooks/acr__jbaruch__agentic-context-registry__freshness-session-start/session-start.sh (session-start): runtime failure: translator failed; Check Python >= 3.9 on the agent PATH and run acr realize before retrying.' >&2\nprintf '%s\\n' '{\"systemMessage\":\"ACR hook .codex/hooks/acr__jbaruch__agentic-context-registry__freshness-session-start/session-start.sh (session-start): runtime failure: translator failed; Check Python \\u003e= 3.9 on the agent PATH and run acr realize before retrying.\"}'\nexit 0\n}\ntrap ':' TERM\nacr_hook_output=$(\ntrap ':' TERM\nacr_hook_timeout=\"$acr_hook_timeout\" acr_hook_command_pid=\"$$\" python3 -I \"$acr_root/.codex/hooks/acr-hook.py\" codex session-start .codex/hooks/acr__jbaruch__agentic-context-registry__freshness-session-start/session-start.sh --policy outdated\nacr_hook_status=$?\nprintf '.'\nexit \"$acr_hook_status\"\n)\nacr_hook_status=$?\ncase $acr_hook_status in\n0|2) trap '' PIPE; printf '%s' \"${acr_hook_output%.}\" 2>/dev/null || exit 141; exit \"$acr_hook_status\" ;;\n129|130|141|143) exit \"$acr_hook_status\" ;;\n*)\nprintf '%s\\n' 'ACR hook .codex/hooks/acr__jbaruch__agentic-context-registry__freshness-session-start/session-start.sh (session-start): runtime failure: translator failed; Check Python >= 3.9 on the agent PATH and run acr realize before retrying.' >&2\nprintf '%s\\n' '{\"systemMessage\":\"ACR hook .codex/hooks/acr__jbaruch__agentic-context-registry__freshness-session-start/session-start.sh (session-start): runtime failure: translator failed; Check Python \\u003e= 3.9 on the agent PATH and run acr realize before retrying.\"}'\nexit 0\n;;\nesac"
[[hooks.Stop]]
[[hooks.Stop.hooks]]
